<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Church Attack Headlines | Sanctuary Shield</title>
    <meta
      name="description"
      content="Documented attacks on Christian churches — the Sanctuary Shield incident desk."
    />
    <meta http-equiv="refresh" content="0;url=https://desk.sanctuaryshieldllc.com/" />
    <link rel="canonical" href="https://desk.sanctuaryshieldllc.com/" />
    <style>
      :root {
        --navy: #102a45;
        --cream: #f6f3ec;
        --gold: #dcb22a;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--cream);
        color: var(--navy);
        font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      .card {
        max-width: 28rem;
        text-align: center;
      }
      .mark {
        width: 48px;
        height: 54px;
        margin: 0 auto 1.25rem;
      }
      p.kicker {
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.7rem;
        color: #7a8796;
        margin: 0 0 0.5rem;
      }
      h1 {
        font-family: "Libre Baskerville", Palatino, serif;
        font-size: 1.65rem;
        font-weight: 400;
        line-height: 1.3;
        margin: 0 0 0.75rem;
      }
      p.body {
        color: #4d5f73;
        line-height: 1.55;
        margin: 0 0 1.5rem;
      }
      a.btn {
        display: inline-block;
        background: var(--navy);
        color: var(--cream);
        text-decoration: none;
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        font-weight: 600;
      }
      a.btn:hover {
        background: #0b1d33;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <svg class="mark" viewBox="0 0 64 72" aria-hidden="true">
          <path
            d="M32 3 L58 14 V38 C58 54 46 64 32 69 C18 64 6 54 6 38 V14 Z"
            fill="none"
            stroke="#102a45"
            stroke-width="2.4"
            stroke-linejoin="round"
          />
          <path
            d="M32 16 V22 L20 34 H44 L32 22"
            fill="none"
            stroke="#102a45"
            stroke-width="2.1"
            stroke-linejoin="round"
          />
          <path d="M22 34 V52 H42 V34" fill="none" stroke="#102a45" stroke-width="2.1" />
          <path d="M32 16 V11 M29 14 H35" stroke="#102a45" stroke-width="2.1" />
        </svg>
        <p class="kicker">Sanctuary Shield</p>
        <h1>The incident desk has moved.</h1>
        <p class="body">
          Church attack headlines now live on the Sanctuary Shield incident desk.
          You are being taken there now.
        </p>
        <a class="btn" href="https://desk.sanctuaryshieldllc.com/">Open the desk</a>
      </div>
    </main>
  </body>
</html>
